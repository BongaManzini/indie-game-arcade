<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>60s Speedrun — Multi-Category 20-Questions Character Guesser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="../shared/categories.js"></script>
  <style>
    :root {
      --bg-base: #0a0a0a;
      --bg-surface: #111111;
      --bg-card: #141414;
      --border-subtle: #262626;
      --border-focus: #383838;
      --text-primary: #ededed;
      --text-muted: #a1a1aa;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    header {
      height: 48px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }
    .badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      background: #14241e;
      color: var(--accent-green);
      border: 1px solid var(--border-subtle);
      padding: 2px 6px;
      border-radius: 2px;
    }
    .brand-title {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 2px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-btn:hover { border-color: var(--border-focus); color: var(--text-primary); }

    main {
      flex: 1;
      max-width: 920px;
      margin: 0 auto;
      width: 100%;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Category Switcher Bar */
    .selector-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      border-radius: 4px;
      align-items: center;
    }
    .selector-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-right: 4px;
    }
    .pill-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill-btn:hover {
      border-color: var(--border-focus);
      color: var(--text-primary);
    }
    .pill-btn.active {
      background: #1f1f1f;
      border-color: var(--accent-green);
      color: var(--text-primary);
      font-weight: 600;
    }

    /* 60s Clock Bar */
    .timer-strip {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-val {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 700;
      color: var(--accent-green);
      letter-spacing: -0.5px;
    }
    .pool-counter {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }
    .pool-counter strong {
      color: var(--text-primary);
      font-size: 14px;
      margin-left: 4px;
    }

    /* Arena Grid */
    .arena-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .arena-grid { grid-template-columns: 1fr; }
    }

    .query-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 16px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel-head {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
    }
    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .q-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: 2px;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      line-height: 1.4;
    }
    .q-btn:hover:not(:disabled) {
      border-color: var(--border-focus);
      background: #181818;
    }
    .q-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .ans-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 2px;
      margin-left: 8px;
      white-space: nowrap;
    }
    .ans-tag.yes { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
    .ans-tag.no { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

    /* Guess Column */
    .guess-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .guess-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 16px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .guess-input {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 2px;
      outline: none;
    }
    .guess-input:focus { border-color: var(--accent-green); }

    .btn-guess {
      background: var(--accent-green);
      color: #000;
      border: 1px solid var(--accent-green);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-guess:hover { opacity: 0.9; }

    /* Autocomplete */
    .sugg-box {
      position: absolute;
      top: 90px;
      left: 16px;
      right: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 2px;
      z-index: 50;
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }
    .sugg-item {
      padding: 8px 12px;
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }
    .sugg-item:hover {
      background: #1f1f1f;
      color: var(--accent-green);
    }

    /* Log Feed */
    .log-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 16px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .log-feed {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      max-height: 220px;
      overflow-y: auto;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 24px;
      max-width: 480px;
      width: 100%;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-group">
      <span class="badge">GAME 05</span>
      <span class="brand-title">60S SPEEDRUN // 20-QUESTIONS SIEVE</span>
    </div>
    <a href="../index.html" class="nav-btn">EXIT TO ARCADE</a>
  </header>

  <main>
    <!-- Category Switcher -->
    <div class="selector-bar">
      <span class="selector-label">CATEGORY:</span>
      <button class="pill-btn active" id="cat-anime" onclick="switchCategory('anime')">Anime & Manga</button>
      <button class="pill-btn" id="cat-movies" onclick="switchCategory('movies')">Movies & Cinema</button>
      <button class="pill-btn" id="cat-gaming" onclick="switchCategory('gaming')">Video Games</button>
      <button class="pill-btn" id="cat-sports" onclick="switchCategory('sports')">Sports & Football</button>
      <button class="pill-btn" id="cat-music" onclick="switchCategory('music')">Music & Hip-Hop</button>
    </div>

    <!-- 60s Clock Bar -->
    <div class="timer-strip">
      <div>
        <div style="font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px;">GLOBAL SPEEDRUN COUNTDOWN</div>
        <div id="clock-display" class="timer-val">60.00s</div>
      </div>
      <div class="pool-counter">
        CANDIDATES REMAINING: <strong id="pool-display">0</strong>
      </div>
    </div>

    <!-- Arena Grid -->
    <div class="arena-grid">
      <!-- Question Switches -->
      <div class="query-card">
        <div class="panel-head">RAPID 20-QUESTIONS // YES/NO TRIAGE</div>
        <div class="questions-list" id="questions-list">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Guess Column -->
      <div class="guess-col">
        <div class="guess-card">
          <div class="panel-head">LOCK IN FINAL GUESS</div>
          <input type="text" id="char-guess-input" class="guess-input" placeholder="Type icon name..." autocomplete="off">
          <button class="btn-guess" onclick="submitFinalGuess()">CONFIRM GUESS</button>
          <div id="sugg-container" class="sugg-box"></div>
        </div>

        <div class="log-card">
          <div class="panel-head">QUERY FEED & CANDIDATE PRUNING</div>
          <div class="log-feed" id="log-feed">
            <div style="color: var(--text-muted);">// Clock active. Fire questions or submit an icon guess!</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="end-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-box">
      <div id="end-title" style="font-family: var(--font-mono); font-size: 18px; font-weight: 700;"></div>
      <div id="end-desc" style="font-size: 13px; color: var(--text-muted); line-height: 1.5;"></div>
      <button class="btn-guess" onclick="startNewGame()">PLAY ANOTHER SPEEDRUN</button>
    </div>
  </div>

  <script>
    // Web Audio Synthesizer
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playTick() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }
      playCorrect() {
        this.init();
        [523, 659, 783, 1046].forEach((f, idx) => {
          const now = this.ctx.currentTime + (idx * 0.08);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.21);
        });
      }
      playBuzzer() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      }
    }
    const audio = new SoundEngine();

    // App State
    let currentCategory = 'anime';
    let target = null;
    let candidatesPool = [];
    let timeLeft = 60.0;
    let timerRunning = false;
    let askedQuestions = {};
    let lastTime = performance.now();

    function getCategoryData() {
      if (window.SIEVE_DATA && window.SIEVE_DATA[currentCategory]) {
        return window.SIEVE_DATA[currentCategory];
      }
      return {
        characters: [
          { name: 'Naruto Uzumaki', series: 'Naruto', powers: true, male: true },
          { name: 'Monkey D. Luffy', series: 'One Piece', powers: true, male: true }
        ],
        questions: [
          { id: 'powers', label: 'Wields Supernatural Powers?' },
          { id: 'male', label: 'Identified as Male?' }
        ]
      };
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.selector-bar .pill-btn').forEach(btn => {
        if (btn.id.startsWith('cat-')) btn.classList.remove('active');
      });
      const activeBtn = document.getElementById(`cat-${cat}`);
      if (activeBtn) activeBtn.classList.add('active');
      startNewGame();
    }

    function startNewGame() {
      document.getElementById('end-modal').style.display = 'none';
      document.getElementById('log-feed').innerHTML = '';
      document.getElementById('char-guess-input').value = '';

      const data = getCategoryData();
      target = data.characters[Math.floor(Math.random() * data.characters.length)];
      candidatesPool = [...data.characters];
      timeLeft = 60.0;
      timerRunning = true;
      askedQuestions = {};

      document.getElementById('pool-display').innerText = candidatesPool.length;
      document.getElementById('clock-display').innerText = '60.00s';
      document.getElementById('clock-display').style.color = 'var(--accent-green)';

      renderQuestions();
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function gameLoop(now) {
      if (!timerRunning) return;
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        timerRunning = false;
        endGame(false, `Time expired! The secret character was ${target.name} (${target.series}).`);
        return;
      }

      const disp = document.getElementById('clock-display');
      disp.innerText = `${timeLeft.toFixed(2)}s`;
      if (timeLeft < 15) disp.style.color = 'var(--accent-red)';
      else if (timeLeft < 30) disp.style.color = 'var(--accent-amber)';

      requestAnimationFrame(gameLoop);
    }

    function renderQuestions() {
      const data = getCategoryData();
      const container = document.getElementById('questions-list');
      container.innerHTML = '';

      data.questions.forEach(q => {
        const isAsked = askedQuestions[q.id] !== undefined;
        const ans = askedQuestions[q.id];

        const btn = document.createElement('button');
        btn.className = 'q-btn';
        btn.disabled = isAsked;
        btn.innerHTML = `
          <span>${q.label}</span>
          ${isAsked ? `<span class="ans-tag ${ans ? 'yes' : 'no'}">${ans ? 'YES' : 'NO'}</span>` : '<span style="color: #666; font-size: 11px;">[ASK]</span>'}
        `;
        btn.onclick = () => askQuestion(q.id, q.label);
        container.appendChild(btn);
      });
    }

    function askQuestion(qId, label) {
      if (!timerRunning || askedQuestions[qId] !== undefined) return;
      audio.playTick();

      const answer = !!target[qId];
      askedQuestions[qId] = answer;

      const prevCount = candidatesPool.length;
      candidatesPool = candidatesPool.filter(c => !!c[qId] === answer);
      const pruned = prevCount - candidatesPool.length;

      document.getElementById('pool-display').innerText = candidatesPool.length;

      const log = document.getElementById('log-feed');
      const item = document.createElement('div');
      item.innerHTML = `
        <span style="color: ${answer ? 'var(--accent-green)' : 'var(--accent-red)'}; font-weight: 700;">[${answer ? 'YES' : 'NO'}]</span>
        <span style="color: #ddd;">${label}</span>
        <span style="color: #666; font-size: 10px;">(-${pruned} candidates)</span>
      `;
      log.prepend(item);

      renderQuestions();
    }

    function submitFinalGuess(overrideName) {
      if (!timerRunning) return;
      const input = document.getElementById('char-guess-input');
      const val = (overrideName || input.value).trim().toLowerCase();
      if (!val) return;

      document.getElementById('sugg-container').style.display = 'none';

      if (val === target.name.toLowerCase()) {
        timerRunning = false;
        audio.playCorrect();
        endGame(true, `Speedrun Success! You identified ${target.name} (${target.series}) with ${timeLeft.toFixed(2)}s remaining!`);
      } else {
        audio.playBuzzer();
        timeLeft = Math.max(0, timeLeft - 5.0);
        const log = document.getElementById('log-feed');
        const item = document.createElement('div');
        item.style.color = 'var(--accent-red)';
        item.innerText = `[ERROR: WRONG GUESS] "${val}" is incorrect! -5.0s penalty applied.`;
        log.prepend(item);
      }
    }

    function endGame(isWin, msg) {
      audio.init();
      const modal = document.getElementById('end-modal');
      const title = document.getElementById('end-title');
      const desc = document.getElementById('end-desc');

      title.innerText = isWin ? 'SPEEDRUN VICTORY' : 'TIME EXPIRED';
      title.style.color = isWin ? 'var(--accent-green)' : 'var(--accent-red)';
      desc.innerHTML = `<div>${msg}</div>`;
      modal.style.display = 'flex';
      if (!isWin) audio.playBuzzer();
    }

    // Autocomplete
    const inp = document.getElementById('char-guess-input');
    const suggBox = document.getElementById('sugg-container');

    inp.addEventListener('input', () => {
      const q = inp.value.trim().toLowerCase();
      if (!q) { suggBox.style.display = 'none'; return; }

      const data = getCategoryData();
      const matches = data.characters.filter(c => c.name.toLowerCase().includes(q));
      if (matches.length === 0) { suggBox.style.display = 'none'; return; }

      suggBox.innerHTML = '';
      matches.slice(0, 5).forEach(m => {
        const d = document.createElement('div');
        d.className = 'sugg-item';
        d.innerText = `${m.name} (${m.series})`;
        d.onclick = () => submitFinalGuess(m.name);
        suggBox.appendChild(d);
      });
      suggBox.style.display = 'block';
    });

    window.addEventListener('DOMContentLoaded', () => {
      startNewGame();
    });
  </script>
</body>
</html>
