<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scale Versus — Multi-Category 1-100 Hot & Cold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="../shared/categories.js"></script>
  <style>
    :root {
      --bg-base: #0a0a0a;
      --bg-surface: #111111;
      --bg-card: #141414;
      --border-subtle: #262626;
      --border-focus: #383838;
      --text-primary: #ededed;
      --text-muted: #a1a1aa;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    header {
      height: 48px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }
    .badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      background: #141f2d;
      color: var(--accent-blue);
      border: 1px solid var(--border-subtle);
      padding: 2px 6px;
      border-radius: 2px;
    }
    .brand-title {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 2px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-btn:hover { border-color: var(--border-focus); color: var(--text-primary); }

    main {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Category Switcher Bar */
    .selector-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      border-radius: 4px;
      align-items: center;
    }
    .selector-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-right: 4px;
    }
    .pill-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill-btn:hover {
      border-color: var(--border-focus);
      color: var(--text-primary);
    }
    .pill-btn.active {
      background: #1f1f1f;
      border-color: var(--accent-blue);
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Target Meter Bar */
    .meter-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 20px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .meter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meter-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .meter-val {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
    }
    .progress-track {
      height: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-blue);
      transition: width 0.3s ease, background 0.3s ease;
    }

    /* Input Section */
    .input-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 20px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .search-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 2px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent-blue); }

    .btn-ping {
      background: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-ping:hover { opacity: 0.9; }

    /* Autocomplete Dropdown */
    .autocomplete-list {
      position: absolute;
      top: 74px;
      left: 20px;
      right: 140px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 2px;
      z-index: 50;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .suggestion-item {
      padding: 8px 12px;
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }
    .suggestion-item:hover {
      background: #1f1f1f;
      color: var(--accent-blue);
    }

    /* Feed List */
    .feed-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 20px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .feed-head {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
    }
    .feed-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      border-radius: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .feed-score {
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 12px;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 24px;
      max-width: 480px;
      width: 100%;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-group">
      <span class="badge">GAME 03</span>
      <span class="brand-title">SCALE VERSUS // 1-100 RELATIONAL RADAR</span>
    </div>
    <a href="../index.html" class="nav-btn">EXIT TO ARCADE</a>
  </header>

  <main>
    <!-- Category Switcher -->
    <div class="selector-bar">
      <span class="selector-label">CATEGORY:</span>
      <button class="pill-btn active" id="cat-anime" onclick="switchCategory('anime')">Anime & Manga</button>
      <button class="pill-btn" id="cat-movies" onclick="switchCategory('movies')">Movies & Cinema</button>
      <button class="pill-btn" id="cat-gaming" onclick="switchCategory('gaming')">Video Games</button>
      <button class="pill-btn" id="cat-sports" onclick="switchCategory('sports')">Sports & Football</button>
      <button class="pill-btn" id="cat-music" onclick="switchCategory('music')">Music & Hip-Hop</button>
    </div>

    <!-- Target Meter Card -->
    <div class="meter-card">
      <div class="meter-head">
        <span class="meter-title">PROXIMITY SCALE TO HIDDEN TARGET</span>
        <span class="meter-val" id="peak-temp" style="color: var(--accent-blue);">HOTTEST: 0 / 100</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="meter-bar"></div>
      </div>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">
        ENTER A POPULAR ICON TO SCAN RELATIONAL DISTANCE (1 = ICE COLD, 100 = DIRECT TARGET MATCH)
      </div>
      <div class="input-row">
        <input type="text" id="guess-input" class="search-input" placeholder="Type icon name (e.g. Kakashi, Vader, Chief, Messi, Eminem)..." autocomplete="off">
        <button class="btn-ping" onclick="submitGuess()">PING TARGET</button>
      </div>
      <div class="autocomplete-list" id="suggestions"></div>
    </div>

    <!-- Feed Log -->
    <div class="feed-card">
      <div class="feed-head">RADAR TELEMETRY FEED (YOU VS RIVAL AI)</div>
      <div class="feed-list" id="feed-list">
        <!-- Log items rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Victory Modal -->
  <div id="win-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-box">
      <div style="font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--accent-green);">
        TARGET ACQUIRED: 100 // SCALE PEAK
      </div>
      <div id="win-desc" style="font-size: 13px; color: var(--text-muted); line-height: 1.5;"></div>
      <button class="btn-ping" onclick="initGame()">PLAY NEW ROUND</button>
    </div>
  </div>

  <script>
    // Web Audio Synthesizer
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playPing(score) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const freq = 200 + (score * 6);
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      }
      playWin() {
        this.init();
        [523, 659, 783, 1046].forEach((f, idx) => {
          const now = this.ctx.currentTime + (idx * 0.1);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        });
      }
    }
    const audio = new SoundEngine();

    // App State
    let currentCategory = 'anime';
    let targetEntity = null;
    let highestScore = 0;
    let turnCount = 0;

    function getCategoryDatabase() {
      if (window.SCALE_DATA && window.SCALE_DATA[currentCategory]) {
        return window.SCALE_DATA[currentCategory];
      }
      return [
        { id: 'naruto', name: 'Naruto Uzumaki', domain: 'Naruto', group: 'Team 7', traits: ['Ninja', 'Jinchuriki', 'Rasengan'] },
        { id: 'sasuke', name: 'Sasuke Uchiha', domain: 'Naruto', group: 'Team 7', traits: ['Ninja', 'Sharingan', 'Chidori'] },
        { id: 'luffy', name: 'Monkey D. Luffy', domain: 'One Piece', group: 'Straw Hats', traits: ['Pirate', 'Rubber', 'Yonko'] }
      ];
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.selector-bar .pill-btn').forEach(btn => {
        if (btn.id.startsWith('cat-')) btn.classList.remove('active');
      });
      const activeBtn = document.getElementById(`cat-${cat}`);
      if (activeBtn) activeBtn.classList.add('active');
      initGame();
    }

    function initGame() {
      document.getElementById('win-modal').style.display = 'none';
      document.getElementById('feed-list').innerHTML = '';
      highestScore = 0;
      turnCount = 0;
      updateMeterHUD(0);

      const db = getCategoryDatabase();
      targetEntity = db[Math.floor(Math.random() * db.length)];
      logFeed('SYSTEM', `Secret target locked for ${currentCategory.toUpperCase()}. Catalog active (${db.length} icons). Ping your first probe!`, 0);
    }

    function calculateProximity(guessEntity, target) {
      if (guessEntity.id === target.id) return 100;

      let score = 10;
      const guessDomain = guessEntity.domain || guessEntity.series;
      const targetDomain = target.domain || target.series;

      if (guessDomain === targetDomain) {
        score += 40;
        const guessGroup = guessEntity.group || guessEntity.team;
        const targetGroup = target.group || target.team;
        if (guessGroup && targetGroup && guessGroup === targetGroup) {
          score += 35;
        }
        const shared = (guessEntity.traits || []).filter(t => (target.traits || []).includes(t));
        score += (shared.length * 4);
      } else {
        const shared = (guessEntity.traits || []).filter(t => (target.traits || []).includes(t));
        score += (shared.length * 3);
      }

      return Math.min(99, Math.max(5, score));
    }

    function submitGuess(nameOverride) {
      const input = document.getElementById('guess-input');
      const query = (nameOverride || input.value).trim().toLowerCase();
      if (!query) return;

      const db = getCategoryDatabase();
      const found = db.find(e => e.name.toLowerCase() === query || e.id === query);
      if (!found) {
        alert('Icon not found in current category roster. Use the autocomplete dropdown for valid entries.');
        return;
      }

      input.value = '';
      document.getElementById('suggestions').style.display = 'none';

      turnCount++;
      const score = calculateProximity(found, targetEntity);
      audio.playPing(score);

      if (score > highestScore) {
        highestScore = score;
        updateMeterHUD(score);
      }

      logFeed('YOU', found.name, score);

      if (score === 100) {
        audio.playWin();
        const modal = document.getElementById('win-modal');
        document.getElementById('win-desc').innerText = `You pinpointed ${targetEntity.name} (${targetEntity.domain || targetEntity.series}) in ${turnCount} queries!`;
        modal.style.display = 'flex';
        return;
      }

      // Rival bot turn
      setTimeout(simulateRivalTurn, 600);
    }

    function simulateRivalTurn() {
      const db = getCategoryDatabase();
      const pool = db.filter(c => c.id !== targetEntity.id);
      const botPick = pool[Math.floor(Math.random() * pool.length)];
      const botScore = calculateProximity(botPick, targetEntity);

      if (botScore > highestScore) {
        highestScore = botScore;
        updateMeterHUD(botScore);
      }

      logFeed('RIVAL', botPick.name, botScore);
    }

    function updateMeterHUD(score) {
      const bar = document.getElementById('meter-bar');
      const val = document.getElementById('peak-temp');

      val.innerText = `HOTTEST: ${score} / 100`;
      bar.style.width = `${score}%`;

      if (score >= 95) {
        bar.style.background = 'var(--accent-green)';
        val.style.color = 'var(--accent-green)';
      } else if (score >= 75) {
        bar.style.background = 'var(--accent-red)';
        val.style.color = 'var(--accent-red)';
      } else if (score >= 45) {
        bar.style.background = 'var(--accent-amber)';
        val.style.color = 'var(--accent-amber)';
      } else {
        bar.style.background = 'var(--accent-blue)';
        val.style.color = 'var(--accent-blue)';
      }
    }

    function logFeed(sender, name, score) {
      const list = document.getElementById('feed-list');
      const item = document.createElement('div');
      item.className = 'feed-item';

      let color = 'var(--accent-blue)';
      if (score >= 95) color = 'var(--accent-green)';
      else if (score >= 75) color = 'var(--accent-red)';
      else if (score >= 45) color = 'var(--accent-amber)';

      item.innerHTML = `
        <div>
          <span style="color: ${sender === 'YOU' ? 'var(--accent-green)' : '#a1a1aa'}; font-weight: 700;">[${sender}]</span>
          <span style="margin-left: 8px; color: #ededed;">${name}</span>
        </div>
        <div class="feed-score" style="background: rgba(255,255,255,0.05); color: ${color};">
          ${score} / 100
        </div>
      `;
      list.prepend(item);
    }

    // Autocomplete search
    const inputElem = document.getElementById('guess-input');
    const suggestBox = document.getElementById('suggestions');

    inputElem.addEventListener('input', () => {
      const q = inputElem.value.trim().toLowerCase();
      if (!q) {
        suggestBox.style.display = 'none';
        return;
      }

      const db = getCategoryDatabase();
      const matches = db.filter(c => c.name.toLowerCase().includes(q) || (c.domain && c.domain.toLowerCase().includes(q)));
      if (matches.length === 0) {
        suggestBox.style.display = 'none';
        return;
      }

      suggestBox.innerHTML = '';
      matches.slice(0, 5).forEach(m => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';
        item.innerText = `${m.name} (${m.domain || m.series})`;
        item.onclick = () => {
          submitGuess(m.name);
        };
        suggestBox.appendChild(item);
      });
      suggestBox.style.display = 'block';
    });

    window.addEventListener('DOMContentLoaded', () => {
      initGame();
    });
  </script>
</body>
</html>
