<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crucible: $15 Anime Draft & Scenario Battle Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0a0a;
      --bg-surface: #111111;
      --bg-card: #141414;
      --border-subtle: #262626;
      --border-focus: #383838;
      --text-primary: #ededed;
      --text-muted: #a1a1aa;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    header {
      height: 48px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }
    .badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      background: #271e10;
      color: var(--accent-amber);
      border: 1px solid var(--border-subtle);
      padding: 2px 6px;
      border-radius: 2px;
    }
    .brand-title {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 2px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-btn:hover { border-color: var(--border-focus); color: var(--text-primary); }

    main {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Budget Header Bar */
    .budget-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 16px 20px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .budget-info { display: flex; flex-direction: column; gap: 4px; }
    .budget-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .budget-val {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-green);
    }
    .scenario-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scenario-select {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      border-radius: 2px;
      outline: none;
    }

    /* Sockets Grid */
    .sockets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (max-width: 768px) {
      .sockets-grid { grid-template-columns: 1fr; }
    }

    .socket-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .socket-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
    }
    .socket-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-amber);
      letter-spacing: 0.5px;
    }
    .socket-cost {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .skill-options-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .skill-option-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 10px 12px;
      border-radius: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.15s ease;
      color: var(--text-primary);
    }
    .skill-option-btn:hover {
      border-color: var(--border-focus);
      background: #181818;
    }
    .skill-option-btn.selected {
      border-color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.08);
    }
    .skill-name {
      font-size: 12px;
      font-weight: 600;
    }
    .skill-desc {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .skill-price-tag {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-amber);
      margin-left: 12px;
    }

    /* Simulation Execution Bar */
    .sim-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-sim {
      background: var(--accent-green);
      color: #000;
      border: 1px solid var(--accent-green);
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      border-radius: 2px;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .btn-sim:hover:not(:disabled) { filter: brightness(1.15); }
    .btn-sim:disabled {
      background: var(--bg-card);
      border-color: var(--border-subtle);
      color: #555;
      cursor: not-allowed;
    }

    /* Simulation Log Feed */
    .battle-feed {
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      padding: 12px 16px;
      border-radius: 2px;
      max-height: 240px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .log-line { color: var(--text-muted); line-height: 1.4; }
    .log-win { color: var(--accent-green); font-weight: 700; }
    .log-loss { color: var(--accent-red); font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div class="brand-group">
      <span class="badge">GAME 04</span>
      <span class="brand-title">CRUCIBLE // $15 DRAFT & SCENARIO BRAWLER</span>
    </div>
    <a href="../index.html" class="nav-btn">EXIT TO ARCADE</a>
  </header>

  <main>
    <!-- Budget Header Bar -->
    <div class="budget-bar">
      <div class="budget-info">
        <div class="budget-title">REMAINING DRAFT BUDGET (HARD $15 CAP)</div>
        <div class="budget-val" id="budget-display">$15 / $15</div>
      </div>
      <div class="scenario-selector">
        <span style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">BATTLEGROUND:</span>
        <select id="scenario-choice" class="scenario-select" onchange="updateScenario()">
          <option value="forest">Chunin Exams: Zone 44 (Forest of Death)</option>
          <option value="culling">The Culling Games: Tokyo Colony 1</option>
          <option value="tournament">Tournament of Power: Null Realm</option>
        </select>
      </div>
    </div>

    <!-- 4 Sockets Grid -->
    <div class="sockets-grid" id="sockets-container">
      <!-- 4 sockets dynamically rendered -->
    </div>

    <!-- Battle Simulation Console -->
    <div class="sim-bar">
      <button id="btn-run-sim" class="btn-sim" onclick="runBattleSimulation()">
        DEPLOY $15 SQUAD & SIMULATE BATTLE
      </button>
      <div class="battle-feed" id="battle-feed">
        <div class="log-line">// Draft 1 option from each socket ($1 to $5) staying within your $15 budget, then run the simulation.</div>
      </div>
    </div>
  </main>

  <script>
    // Web Audio Synthesizer
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playSelect() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }
      playClang() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      playWin() {
        this.init();
        [440, 554, 659, 880].forEach((f, idx) => {
          const now = this.ctx.currentTime + (idx * 0.1);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        });
      }
    }
    const audio = new SoundEngine();

    // Sockets Catalog with $1 to $5 Options
    const SOCKETS = [
      {
        id: 'technique',
        title: 'SOCKET 1: CORE TECHNIQUE',
        options: [
          { cost: 1, name: 'Paper Bomb Wire Detonation', desc: 'Cheap zoning; setup explosive tripwires across branches.' },
          { cost: 2, name: 'Boogie Woogie (Clap Warp)', desc: 'Instant spatial swap with any cursed object or ally.' },
          { cost: 3, name: 'Shadow Possession (Kagemane)', desc: 'Elastic shadow tether; paralyzes and mirrors damage.' },
          { cost: 4, name: 'Kamui / Dimensional Intangibility', desc: 'Phase body through attacks with 0.8s invulnerability.' },
          { cost: 5, name: 'Edo Tensei / Domain Expansion', desc: 'Summon undead titan vanguard or activate guaranteed-hit barrier.' }
        ]
      },
      {
        id: 'hands',
        title: 'SOCKET 2: MARTIAL ARTS / HANDS',
        options: [
          { cost: 1, name: 'Street Boxing & Brawling', desc: 'Basic kinetic punches; reliable short-range knockback.' },
          { cost: 2, name: 'Gentle Fist (Juken)', desc: 'Injects chakra into tenketsu; drains enemy poise and stamina.' },
          { cost: 3, name: 'Dynamic Entry', desc: 'High-speed flying dropkick with +100% poise breakthrough.' },
          { cost: 4, name: 'Flowing Water Rock Smashing Fist', desc: 'Deflects incoming melee strikes with mirrored counter-force.' },
          { cost: 5, name: 'Eight Gates (Night Guy)', desc: 'Sacrificial blood aura; distorts space with supersonic kicks.' }
        ]
      },
      {
        id: 'speed',
        title: 'SOCKET 3: SPEED & MOBILITY',
        options: [
          { cost: 1, name: 'Base Ninja Branch Sprint', desc: 'Standard horizontal ground sprint and branch hopping.' },
          { cost: 2, name: 'Body Flicker (Shunshin)', desc: 'Rapid linear burst dash leaving residual afterimages.' },
          { cost: 3, name: 'Flash Step (Shunpo)', desc: 'Instant elevated air jump across canopy tiers.' },
          { cost: 4, name: 'Gear Second (Blood Pump)', desc: 'Accelerated reflex state; +50% evasion and attack speed.' },
          { cost: 5, name: 'Flying Thunder God (Hiraishin)', desc: 'Instantaneous teleportation between marked formula seals.' }
        ]
      },
      {
        id: 'teammate',
        title: 'SOCKET 4: TEAMMATE / ALLY',
        options: [
          { cost: 1, name: 'Pakkun / Tenten', desc: 'Ninja hound radar tracker & ranged weapon support.' },
          { cost: 2, name: 'Megumi Fushiguro', desc: 'Summons Divine Dog Totality and Nue electricity.' },
          { cost: 3, name: 'Todoroki Shoto', desc: 'Massive Glacier freeze walls and fire zoning.' },
          { cost: 4, name: 'Kakashi Hatake', desc: 'Sharingan tactical reads, Lightning Blade, and dog summons.' },
          { cost: 5, name: 'Gojo Satoru', desc: 'Untouchable Infinity shield and Hollow Purple nuke.' }
        ]
      }
    ];

    let currentLoadout = {
      technique: null,
      hands: null,
      speed: null,
      teammate: null
    };

    function renderSockets() {
      const container = document.getElementById('sockets-container');
      container.innerHTML = '';

      SOCKETS.forEach(sock => {
        const selected = currentLoadout[sock.id];
        const card = document.createElement('div');
        card.className = 'socket-card';
        card.innerHTML = `
          <div class="socket-head">
            <span class="socket-label">${sock.title}</span>
            <span class="socket-cost">${selected ? `$${selected.cost} SELECTED` : 'EMPTY'}</span>
          </div>
          <div class="skill-options-list">
            ${sock.options.map(opt => `
              <div class="skill-option-btn ${selected && selected.name === opt.name ? 'selected' : ''}" 
                   onclick="selectSkill('${sock.id}', ${opt.cost}, '${opt.name}')">
                <div>
                  <div class="skill-name">${opt.name}</div>
                  <div class="skill-desc">${opt.desc}</div>
                </div>
                <div class="skill-price-tag">$${opt.cost}</div>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(card);
      });

      updateBudgetHUD();
    }

    function selectSkill(sockId, cost, name) {
      audio.playSelect();
      const current = currentLoadout[sockId];

      if (current && current.name === name) {
        // Deselect
        currentLoadout[sockId] = null;
      } else {
        // Calculate new budget
        let total = cost;
        Object.keys(currentLoadout).forEach(k => {
          if (k !== sockId && currentLoadout[k]) total += currentLoadout[k].cost;
        });

        if (total > 15) {
          alert(`Budget exceeded! This choice would bring total cost to $${total} (Limit is $15). Deselect or choose lower tier skills first.`);
          return;
        }

        const sockDef = SOCKETS.find(s => s.id === sockId);
        const optDef = sockDef.options.find(o => o.name === name);
        currentLoadout[sockId] = optDef;
      }

      renderSockets();
    }

    function updateBudgetHUD() {
      let spent = 0;
      Object.keys(currentLoadout).forEach(k => {
        if (currentLoadout[k]) spent += currentLoadout[k].cost;
      });

      const rem = 15 - spent;
      const disp = document.getElementById('budget-display');
      disp.innerText = `$${rem} / $15`;
      disp.style.color = rem === 0 ? 'var(--accent-amber)' : 'var(--accent-green)';

      const btn = document.getElementById('btn-run-sim');
      const allSocketsChosen = Object.values(currentLoadout).every(v => v !== null);
      btn.disabled = !allSocketsChosen;
      btn.innerText = allSocketsChosen ? 'DEPLOY $15 SQUAD & SIMULATE BATTLE' : `SELECT ALL 4 SOCKETS ($${rem} REMAINING)`;
    }

    function updateScenario() {
      const feed = document.getElementById('battle-feed');
      const sc = document.getElementById('scenario-choice').value;
      if (sc === 'forest') {
        feed.innerHTML = `<div class="log-line">// SCENARIO: Zone 44 Forest of Death selected. Ambush from canopy foliage deals +150% poise damage. Objective: Capture Heaven & Earth scrolls.</div>`;
      } else if (sc === 'culling') {
        feed.innerHTML = `<div class="log-line">// SCENARIO: The Culling Games (Tokyo Colony 1). Score 100 points against modern sorcerers without being ring-out eliminated.</div>`;
      } else {
        feed.innerHTML = `<div class="log-line">// SCENARIO: Tournament of Power. Ring-out battle royale on Null Realm stage. Flight prohibited.</div>`;
      }
    }

    function runBattleSimulation() {
      audio.playClang();
      const feed = document.getElementById('battle-feed');
      feed.innerHTML = '';

      const t = currentLoadout.technique;
      const h = currentLoadout.hands;
      const s = currentLoadout.speed;
      const a = currentLoadout.teammate;
      const sc = document.getElementById('scenario-choice').value;

      feed.innerHTML += `<div class="log-line">=== DEPLOYING LOADOUT ===</div>`;
      feed.innerHTML += `<div class="log-line">&gt; Technique: ${t.name} ($${t.cost})</div>`;
      feed.innerHTML += `<div class="log-line">&gt; Hands: ${h.name} ($${h.cost})</div>`;
      feed.innerHTML += `<div class="log-line">&gt; Speed: ${s.name} ($${s.cost})</div>`;
      feed.innerHTML += `<div class="log-line">&gt; Ally: ${a.name} ($${a.cost})</div>`;
      feed.innerHTML += `<div class="log-line">------------------------------------</div>`;

      // Simulation combat score computation
      let totalRating = t.cost * 1.2 + h.cost * 1.1 + s.cost * 1.15 + a.cost * 1.3;

      // Synergy bonuses
      let synergies = [];
      if (s.name.includes('Flying Thunder God') && t.name.includes('Kamui')) {
        synergies.push('Space-Time Singularity (Invulnerable Flash Step)');
        totalRating += 4;
      }
      if (h.name.includes('Eight Gates') && a.name.includes('Gojo')) {
        synergies.push('Supreme Frontline Apex (Limitless Cover + Gate Overdrive)');
        totalRating += 5;
      }
      if (t.name.includes('Boogie Woogie') && a.name.includes('Kakashi')) {
        synergies.push('Tactical Substitution (Forced Chidori Swaps)');
        totalRating += 3;
      }

      if (synergies.length > 0) {
        synergies.forEach(syn => {
          feed.innerHTML += `<div class="log-line" style="color: var(--accent-amber);">&gt; [SYNERGY ACTIVE]: ${syn}!</div>`;
        });
      }

      setTimeout(() => {
        audio.playClang();
        if (sc === 'forest') {
          feed.innerHTML += `<div class="log-line">&gt; Entering Zone 44 Canopy: You secure elevated [Hidden] status (+150% poise damage).</div>`;
          feed.innerHTML += `<div class="log-line">&gt; Enemy Patrol Encountered: Holding the missing Heaven Scroll!</div>`;
          feed.innerHTML += `<div class="log-line">&gt; Executing ${h.name} ambush from branch foliage... Guard Break inflicted!</div>`;
        } else {
          feed.innerHTML += `<div class="log-line">&gt; Entering Colony: High-grade cursed spirits converging on perimeter.</div>`;
          feed.innerHTML += `<div class="log-line">&gt; Teammate ${a.name} engages vanguard forces with suppression fire!</div>`;
        }

        setTimeout(() => {
          if (totalRating >= 16) {
            audio.playWin();
            feed.innerHTML += `<div class="log-line log-win">&gt;&gt; [MATCH VERDICT: VICTORY] Target shattered! Both Heaven & Earth scrolls secured. Extraction Tower unlocked!</div>`;
          } else {
            feed.innerHTML += `<div class="log-line log-loss">&gt;&gt; [MATCH VERDICT: DEFEAT] Enemy broke through poise threshold. Try adjusting skill synergy or allocating higher tier teammate!</div>`;
          }
        }, 600);
      }, 500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderSockets();
      updateScenario();
    });
  </script>
</body>
</html>
